<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home - Social Feed</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <h2>Welcome to Social Feed</h2>

  <div id="user-info"></div>
  <button onclick="logout()">Logout</button>

  <hr>

  <h3>Create Post</h3>
  <textarea id="post-text" placeholder="What's on your mind?" rows="3" cols="40"></textarea><br>
  <input type="file" id="post-image"><br>
  <button onclick="submitPost()">Post</button>

  <hr>

  <h3>Feed</h3>
  <div id="feed"></div>

  <script type="module" src="./scripts/post.js"></script>

</body>
</html>
